services:
  app:
    # image: d_n:26
    # image: d_n:26_claude
    image: d_n:26_codex
    environment:
      NODE_PATH: "/tmp/node_modules"
      SAM_CLI_TELEMETRY: 0
      SST_TELEMETRY_DISABLED: 1
      CLAUDE_CONFIG_DIR: /root/.claude
      CODEX_HOME: /tmp/tmp_codex
    volumes:
      - type: bind
        source: "${FOLDER}"
        target: /app
      - type: bind
        source: "$HOME/Downloads"
        target: /data
      # - type: bind
      #   source: "${HOME}/.aws"
      #   target: /root/.aws
      #   read_only: true
      - type: bind
        source: ./volume/vscode-server
        target: /root/.vscode-server
      - type: bind
        source: ./volume/.claude
        target: /root/.claude
      - type: bind
        source: ./volume/.codex/auth.json
        target: /root/.codex/auth.json
      - type: bind
        source: ./volume/.codex/config.toml
        target: /root/.codex/config.toml
      - type: bind
        source: ../claude/CLAUDE.md
        target: /root/.claude/CLAUDE.md
        read_only: true
      - type: bind
        source: ../claude/settings.json
        target: /root/.claude/settings.json
        read_only: true
      - /var/run/docker.sock:/var/run/docker.sock
      - type: bind
        source: ./volume/tmp_codex
        target: /tmp/tmp_codex
    tty: true
    entrypoint: /bin/bash
    ports:
      - "3000:3000"

include:
  - path: ../agent_toolkit/docker-compose.yml
    env_file: .env
